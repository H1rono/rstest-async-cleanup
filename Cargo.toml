[package]
name = "rstest-async-cleanup"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
chrono = { version = "0.4.39", features = ["serde"] }
futures = "0.3.31"
rstest = "0.24.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sqlx.version = "0.8.3"
sqlx.features = ["mysql", "chrono", "uuid", "runtime-tokio", "tls-rustls"]
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tokio = { version = "1.43.0", features = ["full"] }
uuid = { version = "1.11.1", features = ["serde", "v7"] }
